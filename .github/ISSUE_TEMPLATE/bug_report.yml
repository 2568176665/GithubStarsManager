name: Bug Report
description: 报告 GithubStarsManager 中可复现的 Bug
title: "[Bug] "
labels: ["BUG"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 GithubStarsManager！提交前请先搜索是否已有相同或类似 Issue。

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      description: 你在哪个浏览器和 Worker 部署环境遇到了这个问题？
      options:
        - "Web / Cloudflare Worker"
        - "本地 Vite + Worker 开发环境"
        - "不确定"
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug 描述
      description: 请描述发生了什么、你期望发生什么，以及如何复现。
      placeholder: |
        发生了什么？

        期望行为是什么？

        复现步骤：
        1.
        2.
        3.

        发生频率：每次 / 偶发 / 仅出现一次

        App 版本：例如 v0.6.2
    validations:
      required: true

  - type: textarea
    id: additional-info
    attributes:
      label: 附加信息
      description: 补充任何可能帮助定位问题的信息，例如配置方式、相关 Issue、最近变更、浏览器版本、系统架构等。
      placeholder: "例如：Worker 部署在自定义域名，浏览器为 Chrome 版本 xxx，最近更新后出现。"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 粘贴相关日志，或将日志文件拖拽上传到这里。请先删除 GitHub Token、AI API Key、WebDAV 凭据、Worker Secret 等敏感信息。
      placeholder: "粘贴日志，或拖拽 .log / .txt / .zip 等文件到这里。"
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 将截图拖拽上传到这里，或粘贴图片链接。
      placeholder: "拖拽截图到这里，或粘贴图片链接。"
    validations:
      required: false

  - type: textarea
    id: video
    attributes:
      label: 视频
      description: 将录屏拖拽上传到这里，或粘贴视频链接。
      placeholder: "拖拽录屏到这里，或粘贴视频链接。"
    validations:
      required: false
